name: Build CarDoc Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'cardoc-android-native-source.zip'
      - '.github/workflows/build-cardoc-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unpack CarDoc native source
        run: |
          rm -rf android-native
          mkdir android-native
          unzip -q cardoc-android-native-source.zip -d android-native

      - name: Build debug APK
        working-directory: android-native
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarDoc-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
