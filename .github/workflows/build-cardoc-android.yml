name: Build CarDoc Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'cardoc-android-native-source.zip'
      - '.github/workflows/build-cardoc-android.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unpack CarDoc source
        run: |
          rm -rf android-native
          mkdir android-native
          unzip -q cardoc-android-native-source.zip -d android-native

      - name: Build CarDoc APK
        working-directory: android-native
        run: gradle assembleDebug --stacktrace

      - name: Upload CarDoc APK
        uses: actions/upload-artifact@v4
        with:
          name: CarDoc-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
